# herdr global config. `herdr --help` prints the resolved path (this file);
# `herdr --default-config` prints every available key, each commented out with
# its default and a description — that's the reference for anything not
# overridden here. Full docs: https://herdr.dev/docs/configuration/
#
# NOTE: ~/.config/herdr/ also holds runtime state (herdr.sock, herdr.log,
# session.json, sessions/<name>/) written by the running server. Only this
# file is stowed (`stow --no-folding herdr` — folding would symlink the whole
# directory into the repo and put that state under git). After editing this
# file with a server already running, apply it with `herdr server reload-config`
# instead of restarting.

# Config already exists — skip the first-run onboarding flow.
onboarding = false

[theme]
# Follow the host terminal's light/dark appearance, matching Ghostty (which
# already follows macOS's appearance) and this repo's `theme` switcher — see
# README → "Unified theme switching". `dracula` and `catppuccin-latte` are
# both real built-in theme names (from `herdr --default-config`'s own example
# for these two keys) and are the same dark/light pair the switcher uses for
# Claude Code, Neovim, and pi.
auto_switch = true
dark_name = "dracula"
light_name = "catppuccin-latte"

[terminal]
# "auto" (the default) already picks a login shell on macOS, but pin it
# explicitly so panes always source `path_helper`/brew's shell init
# (`/opt/homebrew/bin` on PATH) regardless of platform-default drift — same
# rationale as plans/neovide-path-env.md for Neovide.
shell_mode = "login"

[ui]
agent_panel_sort = "spaces"

# `prefix b` toggles the sidebar at runtime (see README → "Herdr" → Usage
# for the full keymap). "hidden" makes that toggle reclaim the sidebar's full
# width instead of leaving the default "compact" status rail — the more
# useful state when nvim is running in an adjacent pane and you only want to
# glance at Herdr's sidebar occasionally. `sidebar_start_collapsed` is left
# at its default (false, expanded on launch); this key only changes what the
# *toggle* collapses to, not whether Herdr launches collapsed.
sidebar_collapsed_mode = "hidden"
